<aside class="design-lab" aria-label="Developer design controls">
  <button class="dev-toggle" id="dev-toggle" type="button" aria-expanded="false" aria-controls="dev-panel"><span class="dev-symbol" aria-hidden="true">⚙</span> Developer</button>
  <section class="dev-panel" id="dev-panel" aria-labelledby="dev-title" hidden>
    <button class="dev-close" type="button" aria-label="Close developer panel">×</button>
    <h2 id="dev-title">Title designs</h2>
    <p>A little style exploration. Pick your favourite.</p>
    <fieldset>
      <legend>Principle title style</legend>
      <label class="design-option"><input type="radio" name="title-design" value="saucer" checked><span><strong>01 · Glossy saucer</strong><small>A soft purple landing for every number.</small></span><span class="option-preview saucer-preview">Foundation</span></label>
      <label class="design-option"><input type="radio" name="title-design" value="cursive"><span><strong>02 · A little flourish</strong><small>Readable cursive in deep purple. No badge.</small></span><span class="option-preview cursive-preview">Foundation</span></label>
    </fieldset>
    <p class="dev-note">Your selection stays in this browser.</p>
  </section>
</aside>
