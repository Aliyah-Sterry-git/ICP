const dialog=document.querySelector('#info');
const content={about:['A fresh perspective.','iCP is a training platform designed to make the Insurance Core Principles easier to understand.'],approach:['One clear idea at a time.','The planned lessons will bring together clear explanations, practical examples, and short knowledge checks.'],start:['Your next chapter is coming.','This is the first look at iCP. The learning modules are being developed next.']};
